name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Provider-free baseline: OpenSSL and liboqs are not available on a fresh checkout.
      - name: Configure
        run: >
          cmake -S . -B build
          -DHESIA_CORE_BUILD_SHARED=OFF
          -DHESIA_CORE_BUILD_TESTS=ON
          -DHESIA_CORE_WITH_OPENSSL=OFF
          -DHESIA_CORE_WITH_LIBOQS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
